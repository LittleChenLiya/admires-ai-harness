<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Admire's AI Harness</title>
  <desc id="description">Social preview for a from-scratch, event-sourced AI agent harness.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10" />
      <stop offset="1" stop-color="#10151d" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.56">
      <stop offset="0" stop-color="#78e8b0" stop-opacity="0.12" />
      <stop offset="1" stop-color="#78e8b0" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#252a35" stroke-width="1" opacity="0.36" />
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#glow)" />
  <rect x="30" y="30" width="1220" height="580" rx="22" fill="none" stroke="#252a35" />

  <g transform="translate(82 76)">
    <rect width="58" height="58" rx="14" fill="#13231e" stroke="#214938" />
    <path d="M13 31h8l5-13 8 26 6-17 5 8h8" fill="none" stroke="#78e8b0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="78" y="19" fill="#78e8b0" font-family="Consolas, 'SFMono-Regular', monospace" font-size="14" font-weight="600" letter-spacing="2.4">AGENT OPERATIONS</text>
    <text x="78" y="48" fill="#8c93a3" font-family="Inter, 'Segoe UI', sans-serif" font-size="16">FROM-SCRATCH CONTROL PLANE</text>
  </g>

  <g transform="translate(82 190)">
    <text fill="#f2f5fa" font-family="Inter, 'Segoe UI', sans-serif" font-size="63" font-weight="760" letter-spacing="-2.2">Admire’s AI Harness</text>
    <text y="70" fill="#b3bac7" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" font-weight="500">Build · Inspect · Recover · Evaluate</text>
    <text y="112" fill="#8c93a3" font-family="Inter, 'Segoe UI', sans-serif" font-size="18">Event-sourced AI agents, implemented from first principles.</text>
  </g>

  <g transform="translate(82 378)" font-family="Consolas, 'SFMono-Regular', monospace" font-size="13" font-weight="600" letter-spacing="0.6">
    <g><rect width="170" height="38" rx="8" fill="#141821" stroke="#2a303b" /><text x="18" y="25" fill="#c4cad5">EVENT SOURCING</text></g>
    <g transform="translate(184)"><rect width="151" height="38" rx="8" fill="#141821" stroke="#2a303b" /><text x="18" y="25" fill="#c4cad5">MULTI-AGENT</text></g>
    <g transform="translate(349)"><rect width="176" height="38" rx="8" fill="#141821" stroke="#2a303b" /><text x="18" y="25" fill="#c4cad5">HUMAN APPROVAL</text></g>
    <g transform="translate(539)"><rect width="112" height="38" rx="8" fill="#141821" stroke="#2a303b" /><text x="18" y="25" fill="#c4cad5">MCP + RAG</text></g>
  </g>

  <g transform="translate(908 150)">
    <path d="M46 32v89m0 58v90m0-122h105m-105 0 105-82m-105 82 105 82" fill="none" stroke="#3a4850" stroke-width="2" />
    <circle cx="46" cy="32" r="12" fill="#13231e" stroke="#78e8b0" stroke-width="2.5" filter="url(#softGlow)" />
    <circle cx="46" cy="147" r="12" fill="#13231e" stroke="#78e8b0" stroke-width="2.5" />
    <circle cx="46" cy="269" r="12" fill="#13231e" stroke="#78e8b0" stroke-width="2.5" />
    <circle cx="151" cy="65" r="12" fill="#211a10" stroke="#f1b86b" stroke-width="2.5" />
    <circle cx="151" cy="147" r="12" fill="#13231e" stroke="#78e8b0" stroke-width="2.5" />
    <circle cx="151" cy="229" r="12" fill="#13231e" stroke="#78e8b0" stroke-width="2.5" />
    <g fill="#737b88" font-family="Consolas, 'SFMono-Regular', monospace" font-size="12">
      <text x="70" y="36">plan</text><text x="70" y="151">execute</text><text x="70" y="273">persist</text>
      <text x="175" y="69">approve</text><text x="175" y="151">observe</text><text x="175" y="233">evaluate</text>
    </g>
  </g>

  <line x1="82" y1="517" x2="1198" y2="517" stroke="#252a35" />
  <g transform="translate(82 551)" font-family="Consolas, 'SFMono-Regular', monospace" font-size="14">
    <text fill="#78e8b0">$0 offline path</text>
    <text x="178" fill="#596170">·</text>
    <text x="201" fill="#8c93a3">No framework wrapper</text>
    <text x="397" fill="#596170">·</text>
    <text x="420" fill="#8c93a3">MIT licensed</text>
    <text x="1116" text-anchor="end" fill="#596170">v1.0.0</text>
  </g>
</svg>
