name: admires-ai-harness

services:
  harness:
    build:
      context: .
      target: runtime
    environment:
      ADMIRE_DATABASE_PATH: /data/harness.db
      ADMIRE_WORKSPACE_ROOT: /data/workspaces
      ADMIRE_WEB_DIST: /app/web/dist
      ADMIRE_MODEL_PROVIDER: mock
      ADMIRE_ALLOW_NETWORK: "false"
    ports:
      - "8000:8000"
    volumes:
      - type: volume
        source: harness-data
        target: /data
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  demo-smoke:
    build:
      context: .
      target: runtime
    profiles: ["demo"]
    command: ["demo", "all", "--json"]
    depends_on:
      harness:
        condition: service_healthy
    environment:
      ADMIRE_DATABASE_PATH: /data/harness.db
      ADMIRE_WORKSPACE_ROOT: /data/workspaces
      ADMIRE_WEB_DIST: /app/web/dist
      ADMIRE_MODEL_PROVIDER: mock
      ADMIRE_ALLOW_NETWORK: "false"
    volumes:
      - type: volume
        source: harness-data
        target: /data
        volume:
          nocopy: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  harness-data:
