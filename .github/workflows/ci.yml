name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python · quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
      - name: Tests and package coverage
        run: >-
          uv run python -m pytest tests -m "not e2e"
          --cov=admires_harness --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Core runtime coverage gate
        run: >-
          uv run python -m pytest tests/unit/runtime
          --cov=admires_harness.runtime --cov-branch
          --cov-report=term-missing --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  security:
    name: Security · negative paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests -m security -v

  integration:
    name: Integration · API, persistence, and demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/integration -v
      - run: uv run admire demo all --json
      - run: uv run admire evaluate evaluation/reference.jsonl --report eval-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: eval-report.json

  web:
    name: Web · quality, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E · browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --frozen --all-extras
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e

  container:
    name: Container · Compose acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Web/API health and all offline demos
        run: >-
          docker compose --profile demo up --build
          --abort-on-container-exit --exit-code-from demo-smoke
      - name: Compose logs
        if: always()
        run: docker compose --profile demo logs --no-color
      - name: Compose cleanup
        if: always()
        run: docker compose --profile demo down --volumes --remove-orphans
