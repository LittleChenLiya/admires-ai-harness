name: Documentation improvement
description: Report unclear, missing, or incorrect project documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link the page, heading, command, or source comment that needs attention.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Explain what you tried and where the documentation stopped helping.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Optional wording, example, or expected navigation path.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to submit a fix?
      options:
        - Yes
        - Maybe, with guidance
        - No
    validations:
      required: true
